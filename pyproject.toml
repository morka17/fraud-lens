[project]
name = "fraudlens"
version = "0.1.0"
description = "Real-time fraud detection engine with a streaming feature store and zero train/serve skew."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = [
    "fraud-detection",
    "feature-store",
    "real-time-ml",
    "streaming-data",
    "mlops",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "redis>=5.0.0",
    "kafka-python>=2.0.2",
    "pyspark>=3.5.0",
    "xgboost>=2.1.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "feast>=0.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "faker>=28.0.0",
    "fakeredis>=2.24.0",
]

[project.urls]
Homepage = "https://github.com/morka17/fraud-lens"
Repository = "https://github.com/morka17/fraud-lens"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["producer*", "streaming*", "feature_store*", "training*", "api*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"